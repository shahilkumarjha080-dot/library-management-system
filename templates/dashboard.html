<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="dash-wrapper">
        <div class="dash-header">
            <h2>Library Management System</h2>
            <button id="logout-btn">Logout</button>
        </div>

        <div class="dash-body">
            <!-- Add / Edit Form -->
            <div class="card form-card">
                <h3 id="form-title">Add New Book</h3>
                <form id="book-form">
                    <input type="hidden" id="book-id">
                    <div class="field-row">
                        <div class="field">
                            <label for="title">Title</label>
                            <input type="text" id="title" placeholder="Book title" required>
                        </div>
                        <div class="field">
                            <label for="author">Author</label>
                            <input type="text" id="author" placeholder="Author name" required>
                        </div>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label for="isbn">ISBN</label>
                            <input type="text" id="isbn" placeholder="e.g. 9780131103627" required>
                        </div>
                        <div class="field">
                            <label for="published_date">Published Date</label>
                            <input type="date" id="published_date" required>
                        </div>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label for="available">Availability</label>
                            <select id="available">
                                <option value="true">Available</option>
                                <option value="false">Not Available</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="save-btn">Add Book</button>
                        <button type="button" id="cancel-btn" class="btn-secondary" style="display:none;">Cancel</button>
                    </div>
                    <div id="form-error" class="error"></div>
                    <div id="form-success" class="success"></div>
                </form>
            </div>

            <!-- Books Table -->
            <div class="card table-card">
                <h3>Book List</h3>
                <div id="books-container"><p class="loading">Loading books...</p></div>
            </div>
        </div>
    </div>
    <script src="/static/dashboard.js"></script>
</body>
</html>
